name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: python test_review_parser.py
      - run: node --test tests/*.js
      - name: Installed package starts and serves the office
        run: |
          python -m venv /tmp/pkg && /tmp/pkg/bin/pip install -q .
          mkdir -p /tmp/vo && cd /tmp/vo
          VO_STATUS_DIR=/tmp/vo VO_CONFIG=/tmp/vo/vo-config.json VO_PORT=8090 VO_WS_PORT=8091 \
            /tmp/pkg/bin/virtual-office-server > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/api/projects >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8090/ | grep -q '<canvas'
          curl -sf -o /dev/null http://127.0.0.1:8090/game.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/server.py)" = 404
          bash "$GITHUB_WORKSPACE/tests/test_crud_projects.sh" http://127.0.0.1:8090
